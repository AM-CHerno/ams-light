Alpine = ""
AlmaLinux = ""
Amazon = ""
Android = ""
Arch = ""
Artix = ""
CentOS = ""
Debian = ""
DragonFly = ""
Emscripten = ""
EndeavourOS = ""
Fedora = ""
FreeBSD = ""
Garuda = "󰛓"
Gentoo = ""
HardenedBSD = "󰞌"
Illumos = "󰈸"
Kali = ""
Linux = ""
Mabox = ""
Macos = ""
Manjaro = ""
Mariner = ""
MidnightBSD = ""
Mint = ""
NetBSD = ""
NixOS = ""
OpenBSD = "󰈺"
openSUSE = ""
OracleLinux = "󰌷"
Pop = ""
Raspbian = ""
Redhat = ""
RedHatEnterprise = ""
RockyLinux = ""
Redox = "󰀘"
Solus = "󰠳"
SUSE = ""
Ubuntu = ""
Unknown = ""
Void = ""
Windows = "󰍲"
CachyOS = ""

# Command execution time — shown when a command takes noticeable time
[cmd_duration]
format = '\([⏱ $duration]($style)\)'

# Current time (disabled by default in Starship; add `disabled = false` to enable)
[time]
format = '\([$time]($style)\)'

# Package version (shown inside project directories)
[package]
symbol = "󰏗"
format = '\([$symbol $version]($style)\)'

# ---------------------------------------------------------------------------
# DIRECTORY
# Shows current path truncated to 2 levels; lock icon for read-only dirs
# ---------------------------------------------------------------------------

[directory]
read_only = "󰌾"
format = '\([$path]($style)[$read_only]($read_only_style)\)'
truncation_symbol="…/"
truncation_length = 2

# ---------------------------------------------------------------------------
# BATTERY
# Shows battery icon and charge level; color changes based on threshold
# ---------------------------------------------------------------------------
[battery]
format = '\([$symbol]($style)\)'

[[battery.display]]
threshold = 99
style = 'green'
charging_symbol = '󰂂[󱐋](yellow)'
discharging_symbol = '󰂂'

[[battery.display]]
threshold = 80
style = 'blue'
charging_symbol = '󰂀[󱐋](yellow)'
discharging_symbol = '󰂀'

[[battery.display]]
threshold = 60
style = 'cyan'
charging_symbol = '󰁾[󱐋](yellow)'
discharging_symbol = '󰁾'

[[battery.display]]
threshold = 40
style = 'yellow'
charging_symbol = '󰁼[󱐋](yellow)'
discharging_symbol = '󰁼'

[[battery.display]]
threshold = 20
style = 'red'
charging_symbol = '󰁺[󱐋](yellow)'
discharging_symbol = '󰁺'

# ---------------------------------------------------------------------------
# SHELL & ENVIRONMENT
# ---------------------------------------------------------------------------
[nix_shell]
symbol = ""
format = '\([$symbol $state( \($name\))]($style)\)'

[spack]
format = '\([$symbol$environment]($style)\)'

[sudo]
format = '\([as $symbol]($style)\)'

# ---------------------------------------------------------------------------
# VCS - Version Control System
# ---------------------------------------------------------------------------

# Branch name with git icon
[git_branch]
symbol = ""
format = '''[$symbol $branch]($style)'''

# Status indicators: shows counts for each type of change
# ahead/behind, conflicts, stash, deleted, renamed, modified, staged, untracked
[git_status]
format = '[($ahead_behind[|](first))$all_status]($style)'
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"
conflicted = "!=$count"
stashed = "≡$count"
deleted = "✘$count"
renamed = "»$count"
modified = "~$count"
staged = "+$count"
untracked = "?$count"

# VCS alternatives
[fossil_branch]
symbol = ""
format = '\([$symbol$branch]($style)\)'

[hg_branch]
symbol = ""
format = '\([$symbol$branch]($style)\)'

[pijul_channel]
symbol = ""
format = '\([$symbol$channel]($style)\)'

# ---------------------------------------------------------------------------
