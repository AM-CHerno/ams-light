"$schema" = 'https://starship.rs/config-schema.json'

# Maximum time (in ms) Starship is allowed to scan the repo before giving up
scan_timeout = 100

# Prompt layout:
#   ┌─(os hostname username)(directory)(battery)(cmd_duration)
#   │  (git_branch(|git_status)) [other modules]
#   └  [character]
format = '''
┌─\($os$hostname $username\)$directory$battery$cmd_duration(
│ (\($git_branch(|$git_status)\))$all)
└$character'''

# No blank line between prompts
add_newline=false

# ---------------------------------------------------------------------------
# LINE BREAK
# Disabled because the multi-line layout is handled manually in `format`
# ---------------------------------------------------------------------------
[line_break]
disabled = true

# ---------------------------------------------------------------------------
# SYSTEM INFO
# ---------------------------------------------------------------------------

# OS detection — disabled = false means the icon IS shown
[os]
disabled = false

# Hostname — only visible over SSH (shows SSH icon in that case)
[hostname]
ssh_symbol = ""
format = '\([$ssh_symbol$hostname]($style)\)'

# Current logged-in user — always shown
[username]
show_always = true
format = '[$user]($style)'

# Background jobs — shown only when there is at least 1 job
[jobs]
format = '\([$symbol$number]($style)\)'
number_threshold = 1

# RAM and swap usage
[memory_usage]
symbol = "󰍛"
format = '\($symbol[$ram( | $swap)]($style)\)'

# OS-specific Nerd Font icons (covers most major Linux distros + macOS + Windows)
[os.symbols]
